<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gig Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --white: #ffffff; --bg: #f5f5f5;
    --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
    --card-hover-shadow: 0 8px 28px rgba(0,0,0,0.15);
    --primary: #1dbf73; --primary-dark: #19a463;
    --text-dark: #222; --text-mid: #555; --text-light: #888;
    --star: #ffbe00; --border: #e8e8e8;
    --tag-bg: #f0faf5; --tag-text: #1dbf73;
    --badge-top: #ff6b35; --badge-choice: #8b5cf6;
    --radius: 12px; --radius-sm: 8px;
    --wa: #25d366; --wa-dark: #1ebe5e;
    --overlay: rgba(0,0,0,0.55);
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-dark); min-height: 100vh; }

  /* HEADER */
  header {
    background: var(--white); border-bottom: 1px solid var(--border);
    padding: 14px 40px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 200;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); letter-spacing: -1px; }
  .logo span { color: var(--text-dark); }
  .calc-btn {
    display: flex; align-items: center; gap: 6px;
    background: #fff7ed; color: #c2410c;
    border: 1.5px solid #fed7aa; border-radius: 8px;
    padding: 7px 14px; font-size: .82rem; font-weight: 700;
    cursor: pointer; transition: background .2s;
    font-family: 'Inter', sans-serif;
  }
  .calc-btn:hover { background: #ffedd5; }

  /* STICKY SEARCH */
  .search-wrap {
    background: var(--white); padding: 14px 40px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 57px; z-index: 190;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .search-container { position: relative; max-width: 720px; margin: 0 auto; }
  .search-box {
    display: flex; border: 2px solid var(--primary);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(29,191,115,0.15);
  }
  .search-box input {
    flex: 1; border: none; outline: none;
    padding: 11px 16px; font-size: .93rem;
    font-family: 'Inter', sans-serif; color: var(--text-dark); background: #fff;
  }
  .search-box input::placeholder { color: #bbb; }
  .search-box button {
    background: var(--primary); color: #fff; border: none;
    padding: 0 20px; font-size: .88rem; font-weight: 700;
    cursor: pointer; font-family: 'Inter', sans-serif;
    transition: background .2s; display: flex; align-items: center; gap: 7px;
  }
  .search-box button:hover { background: var(--primary-dark); }
  .suggestions {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 300; overflow: hidden; display: none;
  }
  .suggestions.show { display: block; }
  .suggestion-item {
    padding: 10px 16px; font-size: .87rem; cursor: pointer;
    display: flex; align-items: center; gap: 10px; color: var(--text-dark);
    transition: background .15s;
  }
  .suggestion-item:hover, .suggestion-item.active { background: #f0faf5; color: var(--primary); }

  /* PAGE */
  .page { max-width: 1200px; margin: 0 auto; padding: 24px 24px 60px; }
  .result-info { font-size: .87rem; color: var(--text-light); margin-bottom: 18px; }
  .result-info strong { color: var(--text-dark); }
  .no-results { text-align: center; padding: 60px 20px; display: none; }
  .no-results.show { display: block; }
  .no-results h3 { font-size: 1.2rem; margin-bottom: 8px; }
  .no-results p { color: var(--text-light); font-size: .9rem; }

  /* GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

  /* CARD */
  .card {
    background: var(--white); border-radius: var(--radius);
    overflow: hidden; border: 1px solid var(--border);
    box-shadow: var(--card-shadow); cursor: pointer;
    transition: box-shadow .25s, transform .25s; position: relative;
  }
  .card:hover { box-shadow: var(--card-hover-shadow); transform: translateY(-4px); }
  .card-thumb { width: 100%; height: auto; max-height: 200px; object-fit: contain; display: block; background: #f0f0f0; }

  /* CARD TAGS */
  .card-tags {
    display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px;
  }
  .card-tag {
    font-size: .65rem; font-weight: 700; padding: 3px 8px;
    border-radius: 20px; background: var(--tag-bg); color: var(--tag-text);
    border: 1px solid #c3e8d5; white-space: nowrap;
  }

  /* TOP badge */
  .top-badge {
    position: absolute; top: 10px; left: 10px;
    font-size: .67rem; font-weight: 700;
    padding: 3px 9px; border-radius: 20px; text-transform: uppercase; color: #fff;
  }
  .badge-top { background: var(--badge-top); }
  .badge-choice { background: var(--badge-choice); }

  .card-body { padding: 13px 15px 15px; }
  .seller-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .avatar {
    width: 27px; height: 27px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: .68rem; font-weight: 700; flex-shrink: 0;
  }
  .seller-name { font-size: .81rem; font-weight: 600; color: var(--text-dark); }
  .seller-label {
    font-size: .66rem; font-weight: 700; color: var(--primary);
    border: 1px solid var(--primary); border-radius: 4px;
    padding: 1px 5px; margin-left: auto; white-space: nowrap;
  }
  .card-title {
    font-size: .86rem; font-weight: 500; color: var(--text-mid);
    line-height: 1.45; margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border); padding-top: 10px;
  }
  .rating { display: flex; align-items: center; gap: 4px; font-size: .78rem; }
  .stars { color: var(--star); }
  .rating-count { color: var(--text-light); font-size: .74rem; }
  .price { font-size: .92rem; font-weight: 700; color: var(--text-dark); }
  .price span { font-size: .7rem; font-weight: 500; color: var(--text-light); }

  /* POPUP */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: var(--overlay); z-index: 1000;
    align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.active { display: flex; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  .popup {
    background: var(--white); border-radius: 16px; max-width: 560px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: slideUp .25s ease; position: relative;
  }
  .popup-close {
    position: absolute; top: 12px; right: 14px; background: rgba(255,255,255,0.9);
    border: none; cursor: pointer; font-size: 1.3rem; color: var(--text-light);
    z-index: 2; line-height: 1; border-radius: 50%; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center; transition: color .15s;
  }
  .popup-close:hover { color: var(--text-dark); }
  .popup-img { width: 100%; height: 210px; object-fit: cover; border-radius: 16px 16px 0 0; display: block; }
  .popup-cat-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .popup-cat-chip {
    font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    color: #fff; text-transform: uppercase; letter-spacing: .4px;
  }
  .popup-body { padding: 20px 22px 26px; }
  .popup-seller-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .popup-avatar {
    width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: .88rem; flex-shrink: 0;
  }
  .popup-seller-name { font-size: .92rem; font-weight: 700; }
  .popup-seller-sub { font-size: .75rem; color: var(--text-light); }
  .popup-title { font-size: 1.05rem; font-weight: 700; line-height: 1.45; margin-bottom: 10px; }
  .popup-rating { display: flex; align-items: center; gap: 6px; margin-bottom: 13px; }
  .popup-rating .stars { font-size: .95rem; }
  .popup-rating .num { font-weight: 700; }
  .popup-rating .cnt { color: var(--text-light); font-size: .8rem; }
  .popup-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tag {
    background: var(--tag-bg); color: var(--tag-text); font-size: .73rem; font-weight: 600;
    padding: 4px 10px; border-radius: 20px; border: 1px solid #c3e8d5;
  }
  .popup-desc { font-size: .87rem; color: var(--text-mid); line-height: 1.65; margin-bottom: 16px; }
  .popup-meta {
    display: flex; gap: 16px; margin-bottom: 18px;
    padding: 12px 14px; background: var(--bg); border-radius: var(--radius-sm);
  }
  .meta-item { text-align: center; flex: 1; }
  .meta-val { font-size: .95rem; font-weight: 700; }
  .meta-label { font-size: .7rem; color: var(--text-light); margin-top: 2px; }
  .popup-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .popup-price-label { font-size: .72rem; color: var(--text-light); }
  .popup-price-val { font-size: 1.3rem; font-weight: 800; }

  .btn-wa {
    display: flex; align-items: center; gap: 8px; background: var(--wa); color: #fff;
    padding: 11px 18px; border-radius: var(--radius-sm); font-size: .88rem; font-weight: 700;
    text-decoration: none; border: none; cursor: pointer;
    transition: background .2s, transform .15s; flex: 1; justify-content: center;
  }
  .btn-wa:hover { background: var(--wa-dark); transform: scale(1.02); }
  .btn-wa svg { width: 19px; height: 19px; fill: #fff; flex-shrink: 0; }
  .popup::-webkit-scrollbar { width: 5px; }
  .popup::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

  /* CALCULATOR MODAL */
  .calc-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 2000;
    align-items: center; justify-content: center; padding: 20px;
  }
  .calc-overlay.active { display: flex; animation: fadeIn .2s ease; }
  .calc-modal {
    background: var(--white); border-radius: 18px;
    max-width: 400px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: slideUp .25s ease; overflow: hidden;
  }
  .calc-header {
    background: linear-gradient(135deg, #1dbf73, #0d9a5c);
    padding: 20px 22px; color: #fff; position: relative;
  }
  .calc-header h3 { font-size: 1.1rem; font-weight: 700; }
  .calc-header p { font-size: .8rem; opacity: .8; margin-top: 3px; }
  .calc-close {
    position: absolute; top: 14px; right: 16px;
    background: rgba(255,255,255,0.2); border: none; color: #fff;
    font-size: 1.1rem; cursor: pointer; border-radius: 50%;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  }
  .calc-body { padding: 22px; }
  .calc-rate-info {
    background: #f0faf5; border: 1px solid #c3e8d5; border-radius: 8px;
    padding: 8px 14px; font-size: .78rem; color: #166534; margin-bottom: 18px;
    display: flex; align-items: center; gap: 6px;
  }
  .calc-section { margin-bottom: 20px; }
  .calc-section label { font-size: .82rem; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 6px; }
  .calc-input-row { display: flex; gap: 8px; }
  .calc-input-row input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: .95rem; font-family: 'Inter', sans-serif;
    outline: none; transition: border-color .2s;
  }
  .calc-input-row input:focus { border-color: var(--primary); }
  .calc-input-row .unit-label {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: .82rem; font-weight: 700; color: var(--text-mid);
    display: flex; align-items: center;
  }
  .calc-result {
    background: #f0faf5; border-radius: 8px;
    padding: 12px 14px; margin-top: 8px;
    font-size: 1.1rem; font-weight: 700; color: #0d7a4a;
    min-height: 44px; display: flex; align-items: center;
  }
  .calc-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0 16px; }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    .search-wrap { padding: 12px 16px 14px; top: 53px; }
    .page { padding: 16px 14px 50px; }
    .popup-body { padding: 14px 15px 20px; }
  }
</style>
</head>

// category style map
const CAT_STYLE = {
  seo:     { cls: "cat-seo",     color: "#0ea5e9" },
  design:  { cls: "cat-design",  color: "#8b5cf6" },
  ads:     { cls: "cat-ads",     color: "#f59e0b" },
  gmb:     { cls: "cat-gmb",     color: "#10b981" },
  adsense: { cls: "cat-adsense", color: "#ef4444" },
};

function fmtPkr(n) { return "Rs " + n.toLocaleString("en-PK"); }

// ── SEARCH ────────────────────────────────────────────────
const searchInput = document.getElementById("searchInput");
const suggestionsEl = document.getElementById("suggestions");
let activeIdx = -1;

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { hideSuggestions(); renderGrid(gigs); updateResultInfo(gigs.length, ""); return; }
  showSuggestions(q);
  doSearch(); // live filter as user types
});

searchInput.addEventListener("keydown", e => {
  const items = suggestionsEl.querySelectorAll(".suggestion-item");
  if (e.key === "ArrowDown") { activeIdx = Math.min(activeIdx+1, items.length-1); updateActive(items); }
  else if (e.key === "ArrowUp") { activeIdx = Math.max(activeIdx-1, -1); updateActive(items); }
  else if (e.key === "Enter") {
    if (activeIdx >= 0 && items[activeIdx]) searchInput.value = items[activeIdx].dataset.val;
    hideSuggestions(); doSearch();
  } else if (e.key === "Escape") { hideSuggestions(); }
});

function updateActive(items) { items.forEach((it,i) => it.classList.toggle("active", i===activeIdx)); }

function showSuggestions(q) {
  activeIdx = -1;
  const allWords = new Set();
  // Tags as primary suggestions
  gigs.forEach(g => {
    g.tags.forEach(t => { if (t.toLowerCase().startsWith(q) || t.toLowerCase().includes(q)) allWords.add(t); });
    (g.title + " " + g.searchKeys).split(/\s+/).forEach(w => {
      if (w.toLowerCase().startsWith(q) && w.length > 2) allWords.add(w);
    });
  });
  const matches = [...allWords].slice(0, 7);
  if (!matches.length) { hideSuggestions(); return; }
  suggestionsEl.innerHTML = matches.map(w =>
    `<div class="suggestion-item" data-val="${w}" onclick="pickSuggestion('${w}')">🔍 ${w}</div>`
  ).join("");
  suggestionsEl.classList.add("show");
}

function hideSuggestions() { suggestionsEl.classList.remove("show"); }
function pickSuggestion(val) { searchInput.value = val; hideSuggestions(); doSearch(); }

function doSearch() {
  const q = searchInput.value.trim().toLowerCase();
  hideSuggestions();
  if (!q) { renderGrid(gigs); updateResultInfo(gigs.length, ""); return; }
  const filtered = gigs.filter(g =>
    g.title.toLowerCase().includes(q) ||
    g.tags.some(t => t.toLowerCase().includes(q)) ||
    g.seller.toLowerCase().includes(q) ||
    g.catLabel.toLowerCase().includes(q) ||
    g.searchKeys.toLowerCase().includes(q) ||
    g.desc.toLowerCase().includes(q)
  );
  renderGrid(filtered);
  updateResultInfo(filtered.length, q);
}

function updateResultInfo(count, q) {
  const el = document.getElementById("resultInfo");
  if (!q) { el.textContent = `Showing all ${count} services`; return; }
  el.innerHTML = count
    ? `<strong>${count}</strong> service${count!==1?"s":""} found for "<strong>${q}</strong>"`
    : "";
}

// ── RENDER ────────────────────────────────────────────────
function renderGrid(list) {
  const grid = document.getElementById("gigGrid");
  const noRes = document.getElementById("noResults");
  if (!list.length) { grid.innerHTML = ""; noRes.classList.add("show"); return; }
  noRes.classList.remove("show");
  grid.innerHTML = list.map(g => {
    const cs = CAT_STYLE[g.category] || CAT_STYLE.seo;
    const pkr = fmtPkr(g.pricePkr);
    const tagsHtml = g.tags.map(t => `<span class="card-tag">${t}</span>`).join("");
    return `
    <div class="card" onclick="openPopup(${g.id})">
      <img class="card-thumb" src="${g.img}" alt="${g.title}" loading="lazy" onerror="this.style.background='#e8e8e8'">
      ${g.badge === "top" ? '<span class="top-badge badge-top">Top Rated</span>' : ""}
      ${g.badge === "choice" ? '<span class="top-badge badge-choice">Kwork\'s Choice</span>' : ""}
      <div class="card-body">
        <div class="seller-row">
          <div class="avatar" style="background:linear-gradient(135deg,${g.sellerColor},${g.sellerColor}99)">${g.sellerInit}</div>
          <span class="seller-name">${g.seller}</span>
          ${g.label ? `<span class="seller-label">${g.label}</span>` : ""}
        </div>
        <div class="card-tags">${tagsHtml}</div>
        <div class="card-title">${g.title}</div>
        <div class="card-footer">
          <div class="rating">
            <span class="stars">★</span>
            <strong>${g.rating}</strong>
            <span class="rating-count">(${g.reviews})</span>
          </div>
          <div class="price"><span>From </span>${pkr}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

// ── POPUP ─────────────────────────────────────────────────
function openPopup(id) {
  const g = gigs.find(x => x.id === id);
  if (!g) return;
  const cs = CAT_STYLE[g.category] || CAT_STYLE.seo;
  const pkr = g.pricePkr;

  document.getElementById("popupImg").src = g.img;
  document.getElementById("popupImg").alt = g.title;
  document.getElementById("popupAvatar").innerHTML =
    `<div style="width:100%;height:100%;background:linear-gradient(135deg,${g.sellerColor},${g.sellerColor}99);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.88rem">${g.sellerInit}</div>`;
  document.getElementById("popupSellerName").textContent = g.seller;
  document.getElementById("popupSellerSub").textContent = g.label || "Seller";
  document.getElementById("popupTitle").textContent = g.title;
  document.getElementById("popupRating").innerHTML =
    `<span class="stars">${"★".repeat(Math.floor(g.rating))}</span><span class="num">${g.rating}</span><span class="cnt">(${g.reviews} reviews)</span>`;
  document.getElementById("popupTags").innerHTML = g.tags.map(t => `<span class="tag">${t}</span>`).join("");
  document.getElementById("popupDesc").textContent = g.desc;
  document.getElementById("popupMeta").innerHTML = `
    <div class="meta-item"><div class="meta-val">${g.delivery}</div><div class="meta-label">Delivery</div></div>
    <div class="meta-item"><div class="meta-val">${g.revisions}</div><div class="meta-label">Revisions</div></div>
    <div class="meta-item"><div class="meta-val">${g.reviews}</div><div class="meta-label">Orders Done</div></div>`;
  document.getElementById("popupPrice").textContent = fmtPkr(pkr);

  const waNumber = g.waNumber || WHATSAPP_NUMBER;
  const msg = encodeURIComponent(`Assalam o Alaikum! Mujhe aapki yeh service chahiye: "${g.title}" — ${fmtPkr(pkr)}. Mehrbani karke details batayein.`);
  document.getElementById("popupWA").href = `https://wa.me/${waNumber}?text=${msg}`;

  document.getElementById("overlay").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closePopup() { document.getElementById("overlay").classList.remove("active"); document.body.style.overflow = ""; }
function closePopupOutside(e) { if (e.target === document.getElementById("overlay")) closePopup(); }

// ── CALCULATOR ────────────────────────────────────────────
document.getElementById("rateDisplay").textContent = USD_TO_PKR.toLocaleString();

function openCalc() { document.getElementById("calcOverlay").classList.add("active"); document.body.style.overflow = "hidden"; }
function closeCalc() { document.getElementById("calcOverlay").classList.remove("active"); document.body.style.overflow = ""; }
function closeCalcOutside(e) { if (e.target === document.getElementById("calcOverlay")) closeCalc(); }

function calcUsdToPkr() {
  const v = parseFloat(document.getElementById("usdInput").value);
  document.getElementById("usdResult").textContent = isNaN(v) || v < 0 ? "—" : fmtPkr(Math.round(v * USD_TO_PKR));
}
function calcPkrToUsd() {
  const v = parseFloat(document.getElementById("pkrInput").value);
  document.getElementById("pkrResult").textContent = isNaN(v) || v < 0 ? "—" : "$ " + (v / USD_TO_PKR).toFixed(2) + " USD";
}

document.addEventListener("keydown", e => { if (e.key === "Escape") { closePopup(); closeCalc(); } });
document.addEventListener("click", e => { if (!e.target.closest(".search-container")) hideSuggestions(); });

renderGrid(gigs);
updateResultInfo(gigs.length, "");
</script>
</body>
</html>
